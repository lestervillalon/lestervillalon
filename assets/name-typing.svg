<svg width="1200" height="110" viewBox="0 0 1200 110"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 700;
      fill: #00D9FF;
    }

    .cursor {
      fill: #00D9FF;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="nameClip">
      <rect x="290" y="18" width="0" height="70">
        <animate
          attributeName="width"
          values="0;620;620;0"
          keyTimes="0;0.35;0.78;1"
          dur="8s"
          repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <text
    x="600"
    y="72"
    text-anchor="middle"
    class="name"
    clip-path="url(#nameClip)">
    Lester Matthew Villalon
  </text>

  <rect
    x="290"
    y="30"
    width="10"
    height="44"
    rx="2"
    class="cursor">

    <animate
      attributeName="x"
      values="290;910;910;290"
      keyTimes="0;0.35;0.78;1"
      dur="8s"
      repeatCount="indefinite" />

  </rect>

</svg>
